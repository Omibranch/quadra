name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Point the build at the NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using $ndk"

      - run: npm ci

      - name: Xray-core for Android
        run: node tools/fetch-xray.mjs --android

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          node tools/android-prepare.mjs

      - name: Build the APK
        run: npx tauri android build --debug --apk --target aarch64 x86_64

      - name: Collect the APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "built $apk"
          cp "$apk" quadra-android-debug.apk
          ls -la quadra-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quadra-android-debug
          path: quadra-android-debug.apk

      - name: Let the emulator use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Connect on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/android-e2e.sh quadra-android-debug.apk

      # The build people install: optimised, one file per architecture, signed with the project's key.
      - name: Build the release APKs
        run: npx tauri android build --apk --split-per-abi --target aarch64 x86_64

      - name: Sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          version=$(node -p "require('./package.json').version")
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk'); do
            case "$apk" in
              *arm64*) out="Quadra_${version}_android-arm64.apk" ;;
              *x86_64*) out="Quadra_${version}_android-x86_64.apk" ;;
              *) continue ;;
            esac
            "$tools/zipalign" -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 --ks-key-alias quadra               --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify --print-certs "$out" | head -2
            ls -la "$out"
          done
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Start the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/android-smoke.sh Quadra_*_android-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quadra-android
          if-no-files-found: error
          path: Quadra_*_android-arm64.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release workflow makes the draft; wait for it rather than make a second one
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Quadra $GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" Quadra_*_android-arm64.apk --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          if-no-files-found: ignore
          path: android-e2e/
