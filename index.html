<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quadra</title>
    <script>
      // Last used theme and accent, so the first paint already has the right colours.
      try {
        var t = localStorage.getItem('quadra.theme');
        var a = localStorage.getItem('quadra.accent');
        if (t) document.documentElement.dataset.theme = t;
        if (a) document.documentElement.style.setProperty('--accent', a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
