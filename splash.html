<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Quadra</title>
    <style>
      /* A bare window: nothing but the cube on whatever is behind it. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { display: grid; place-items: center; cursor: default; user-select: none; }
      canvas {
        width: 176px; height: 176px;
        opacity: 0;
        transition: opacity 160ms, transform 320ms cubic-bezier(0.5, 0, 0.9, 0.4);
      }
      canvas.on { opacity: 1; }
      canvas.out { opacity: 0; transform: scale(1.5); }
    </style>
  </head>
  <body>
    <canvas width="240" height="240" data-tauri-drag-region></canvas>
    <script type="module" src="/src/splash.js"></script>
  </body>
</html>
