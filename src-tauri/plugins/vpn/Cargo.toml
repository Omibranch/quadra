[package]
name = "tauri-plugin-quadra-vpn"
version = "0.1.0"
edition = "2021"
description = "Quadra's Android side: the system VPN service and a few things only the platform can tell"
links = "tauri-plugin-quadra-vpn"
publish = false

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
